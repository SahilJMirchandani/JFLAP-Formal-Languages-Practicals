<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">NFA for (0+1)*1</title>
  <desc id="desc">Two-state NFA. Initial state q0 loops on 0 and 1, and has a transition to final state q1 on input 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="760" height="280" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">NFA for (0+1)*1</text>
  <path d="M45 145 L112 145" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="160" cy="145" r="38" fill="#fff" stroke="#111827" stroke-width="2.4"/>
  <text x="160" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">q0</text>
  <path d="M136 111 C104 47,216 47,184 111" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">0, 1</text>
  <path d="M198 145 L402 145" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">1</text>
  <circle cx="445" cy="145" r="38" fill="#fff" stroke="#111827" stroke-width="2.4"/>
  <circle cx="445" cy="145" r="31" fill="none" stroke="#111827" stroke-width="1.8"/>
  <text x="445" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">q1</text>
  <text x="380" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">q0: initial state; q1: final state</text>
</svg>
